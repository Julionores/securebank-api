services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: securebank
      POSTGRES_USER: securebank
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans un fichier .env (voir .env.example)}
    volumes:
      - securebank_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securebank"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/securebank
      DB_USERNAME: securebank
      DB_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans un fichier .env}
      JWT_SECRET: ${JWT_SECRET:?Définir JWT_SECRET (min. 32 caractères) dans un fichier .env}
      JWT_EXPIRATION_MINUTES: 30
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "8080:8080"

volumes:
  securebank_pgdata:
