spring:
  application:
    name: securebank-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/securebank}
    username: ${DB_USERNAME:securebank}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # "validate" en prod : le schéma est TOUJOURS piloté par Flyway, jamais par Hibernate
      # (ddl-auto=update est proscrit en environnement bancaire - dérive de schéma non tracée).
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never # ne jamais exposer le détail des composants (DB, disque...) publiquement

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

security:
  jwt:
    # Secret injecté par variable d'environnement / coffre-fort en production.
    # La valeur ci-dessous n'est utilisée QUE pour le développement local et doit être
    # remplacée avant tout déploiement (voir SECURITY.md - Gestion des secrets).
    secret: ${JWT_SECRET:dev-only-change-me-32-characters-minimum-please}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    root: INFO
    com.jtmcloud.securebank: INFO
    org.hibernate.SQL: WARN
