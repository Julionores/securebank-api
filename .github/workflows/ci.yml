name: CI/CD DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compiler et exécuter les tests
        run: mvn -B clean verify

      - name: Publier les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  dependency-scan:
    name: Scan des dépendances (SCA)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Configurer JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # OWASP Dependency-Check : détecte les dépendances portant des CVE connues.
      # Nécessite le secret NVD_API_KEY (gratuit sur nvd.nist.gov) pour éviter le rate-limiting.
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: securebank-api
          path: .
          format: HTML
          args: >
            --failOnCVSS 8
            --nvdApiKey ${{ secrets.NVD_API_KEY }}

      - name: Publier le rapport Dependency-Check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/

  static-analysis:
    name: Analyse statique du code (SAST)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      # Semgrep : règles OWASP Top 10 + bonnes pratiques Java/Spring.
      - name: Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/java
            p/spring

  container-scan:
    name: Scan de l'image Docker
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t securebank-api:${{ github.sha }} .

      # Trivy : vulnérabilités connues dans l'image (OS + dépendances applicatives).
      - name: Trivy - scan de vulnérabilités
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: securebank-api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
